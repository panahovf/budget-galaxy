# Publishes the page (the site/ folder) to GitHub Pages: panahovf.github.io/budget-galaxy/
#
# Runs:
#   - whenever something is pushed to main,
#   - by hand: Actions tab -> "Publish the page" -> "Run workflow".
#
# It publishes site/ as it is in the repository: the notebooks are run by hand (they write site/galaxy.json, step 5),
# and their results are committed, so the page shows exactly the numbers in data/.

name: Publish the page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
